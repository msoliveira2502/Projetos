<style>

<script>
let chartMensal = null;
let chartCategorias = null;
let dadosAtualDashboard = [];

// Se houver alterações locais pendentes (enquanto o GitHub Pages publica), usa elas
const cachePendente = localStorage.getItem("lancamentos_pendentes");
if (cachePendente) {
  lancamentos = JSON.parse(cachePendente);
}

// Garante que cada lançamento tenha um ID único
function reindexarIds() {
  if (typeof lancamentos !== "undefined") {
    lancamentos.forEach((item, index) => {
      item.id = index + 1;
    });
  } else {
    console.error("ERRO: A variável 'lancamentos' não foi encontrada no dados.js!");
  }
}
reindexarIds();

const CONFIG = {
  rendaMensal: 19000
};

const limites = {
  "Educação": 2000,
  "Cartões": 5000,
  "Casa/Transporte": 6000
};

// ----------------------
// Gráficos e Cálculos
// ----------------------

function salvarDados() {
  lancamentos.sort((a, b) => a.data.localeCompare(b.data));
  reindexarIds();
  localStorage.setItem("lancamentos_pendentes", JSON.stringify(lancamentos));
}

function graficoMensal(lancamentosFiltrados) {
  if (chartMensal) chartMensal.destroy();

  const mesesNomes = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
  const porMes = {};

  lancamentosFiltrados.forEach(l => {
    const partes = l.data.split("-");
    const mesIndex = parseInt(partes[1], 10) - 1;
    porMes[mesIndex] = (porMes[mesIndex] || 0) + l.valor;
  });

  const labels = Object.keys(porMes).map(i => mesesNomes[i]);
  const valores = Object.values(porMes);

  const limite = CONFIG.rendaMensal;
  const cores = valores.map(v => {
    const perc = (v / limite) * 100;
    if (perc <= 90) return "#10b981";
    if (perc <= 100) return "#f59e0b";
    return "#ef4444";
  });

  chartMensal = new Chart(document.getElementById("graficoMensal"), {
    type: "bar",
    data: {
      labels: labels,
      datasets: [
        { label: "Despesas Mensais", data: valores, backgroundColor: cores, borderRadius: 6, maxBarThickness: 60 },
        { label: "Limite Orçamento", data: Array(valores.length).fill(limite), type: "line", borderColor: "#0f172a", borderWidth: 2, pointRadius: 0 }
      ]
    },
    options: { plugins: { title: { display: true, text: "Acompanhamento Mensal com Limite" } } }
  });
}


function atualizarBoxes(dados) {
  const despesas = dados.reduce((s, v) => s + v.valor, 0);
  const mesesSelecionados = new Set(dados.map(l => l.data.substring(0, 7))).size;
  const rendaPeriodo = CONFIG.rendaMensal * mesesSelecionados;
  const saldo = rendaPeriodo - despesas;
  const comprometimento = rendaPeriodo > 0 ? (despesas / rendaPeriodo) * 100 : 0;

  document.getElementById("caixaRenda").innerHTML =
    `<b>Renda</b><br>${rendaPeriodo.toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}`;

  document.getElementById("caixaDespesas").innerHTML =
    `<b>Despesas</b><br>${despesas.toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}`;

  document.getElementById("caixaSaldo").innerHTML =
    `<b>Saldo</b><br>${saldo.toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}`;

  document.getElementById("caixaComprometimento").innerHTML =
    `<b>Comprometimento</b><br>${comprometimento.toFixed(1)}%`;

  let status = "🟢 Saudável";
  if (comprometimento > 80) status = "🟡 Atenção";
  if (comprometimento > 95) status = "🔴 Crítico";

  document.getElementById("caixaSaude").innerHTML =
    `<b>Saúde Financeira</b><br>${status}`;
}

function recarregarDashboard() {
  const inicio = document.getElementById("dataInicio").value;
  const fim = document.getElementById("dataFim").value;

  let lancamentosFiltrados = lancamentos.filter(l => {
    const anoMes = l.data.substring(0, 7);
    return (!inicio || anoMes >= inicio) && (!fim || anoMes <= fim);
  });

  dadosAtualDashboard = [...lancamentosFiltrados];
  atualizarTabela(dadosAtualDashboard);
  atualizarBoxes(dadosAtualDashboard);
  graficoMensal(dadosAtualDashboard);
  graficoCategorias(dadosAtualDashboard);
  gerarAlertas(dadosAtualDashboard);

function gerarAlertas(dados) {
  let html = "";

  Object.keys(limites).forEach(cat => {
    const gasto = dados
      .filter(l => l.categoria === cat)
      .reduce((s, v) => s + v.valor, 0);

    if (gasto > limites[cat]) {
      html += `
      <p style="margin:4px 0;">
        ⚠ <strong>${cat}</strong> ultrapassou limite (${gasto.toLocaleString("pt-BR", { style: "currency", currency: "BRL" })})
      </p>`;
    }
  });

  document.getElementById("alertas").innerHTML = html;
}

function graficoCategorias(dados) {
  if (chartCategorias) chartCategorias.destroy();

  const porCategoria = {};
  dados.forEach(l => {
    porCategoria[l.categoria] = (porCategoria[l.categoria] || 0) + l.valor;
  });

  const total = Object.values(porCategoria).reduce((a, b) => a + b, 0);

  chartCategorias = new Chart(document.getElementById("graficoCategorias"), {
    type: "doughnut",
    data: {
      labels: Object.keys(porCategoria),
      datasets: [{
        data: Object.values(porCategoria),
        backgroundColor: ["#10b981", "#f59e0b", "#3b82f6", "#8b5cf6", "#ef4444", "#64748b", "#06b6d4"],
        borderWidth: 2,
        borderColor: "#ffffff"
      }]
    },
    options: {
      cutout: "55%",
      plugins: {
        title: { display: true, text: "Despesas por Categoria" },
        datalabels: {
          color: "#fff",
          font: { weight: "bold", size: 11 },
          formatter: (value) => {
            const perc = total > 0 ? (value / total * 100) : 0;
            return perc >= 4 ? perc.toFixed(1) + "%" : ""; // Evita sobreposição em fatias muito finas
          }
        }
      }
    },
    plugins: [ChartDataLabels]
  });
}

function resumoCategorias(dados) {
  const mapa = {};
  dados.forEach(l => {
    mapa[l.categoria] = (mapa[l.categoria] || 0) + l.valor;
  });

  const total = Object.values(mapa).reduce((a, b) => a + b, 0);
  const tbody = document.querySelector("#tabelaCategorias tbody");
  tbody.innerHTML = "";

  Object.entries(mapa).forEach(([categoria, valor]) => {
    const perc = total > 0 ? (valor / total * 100).toFixed(1) : "0.0";
    tbody.innerHTML += `
      <tr>
        <td>${categoria}</td>
        <td>${valor.toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}</td>
        <td>${perc}%</td>
      </tr>
    `;
  });
}

function requisicaoGitHub(metodo, url, token, corpoObj) {
  return new Promise(function (resolve, reject) {
    if (!token || token.length < 15) {
      reject(new Error("Token vazio ou curto demais. Clique em 🔑 Token e cole novamente."));
      return;
    }

    const xhr = new XMLHttpRequest();
    xhr.open(metodo, url, true);
    xhr.setRequestHeader("Authorization", "Bearer " + token);
    if (corpoObj) {
      xhr.setRequestHeader("Content-Type", "application/json");
    }

    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300) {
        resolve(JSON.parse(xhr.responseText));
      } else {
        let msg = "HTTP " + xhr.status;
        try {
          const errJson = JSON.parse(xhr.responseText);
          if (errJson.message) msg += " - " + errJson.message;
        } catch (e) {}
        reject(new Error(msg));
      }
    };

    xhr.onerror = function () {
      reject(new Error("O iPad bloqueou o acesso a ://github.com. Verifique: 1) Se há Content-Security-Policy no <head>; 2) Se o Wi-Fi/VPN/iCloud Private Relay está bloqueando ://github.com."));
    };

    xhr.send(corpoObj ? JSON.stringify(corpoObj) : null);
  });
}

document.getElementById("btnSincronizarGitHub").addEventListener("click", async function () {
  let token = localStorage.getItem("github_token");
  if (!token) {
    token = prompt("Cole seu Personal Access Token do GitHub:");
    if (!token) return;
  }

  token = token.replace(/[^a-zA-Z0-9_]/g, "");
  localStorage.setItem("github_token", token);

  const btn = this;
  btn.disabled = true;
  btn.innerText = "⏳ Salvando...";

  const usuario = "msoliveira2502";
  const repositorio = "Projetos";
  const caminhoArquivo = "dados.js";
  const urlApi = window.location.protocol + "//api." + "github." + "com/repos/msoliveira2502/Projetos/contents/dados.js";




  try {
    // 1. Busca o SHA atual do arquivo
    const infoArquivo = await requisicaoGitHub("GET", urlApi + "?ref=main&t=" + Date.now(), token, null);

    // 2. Monta o novo conteúdo do dados.js
    const dadosLimpos = lancamentos.map(({ data, descricao, categoria, valor }) => ({
      data,
      descricao,
      categoria,
      valor
    }));

    const linhas = dadosLimpos.map(item => "  " + JSON.stringify(item));
    const conteudoFinal = "let lancamentos = [\n" + linhas.join(",\n") + "\n];\n\nlancamentos.forEach((item, index) => {\n  item.id = index + 1;\n});\n";
    const conteudoBase64 = btoa(unescape(encodeURIComponent(conteudoFinal)));

    // 3. Envia a atualização para o GitHub
    await requisicaoGitHub("PUT", urlApi, token, {
      message: "Atualização via portal de orçamento",
      content: conteudoBase64,
      sha: infoArquivo.sha,
      branch: "main"
    });

    localStorage.removeItem("lancamentos_pendentes");
    alert("Salvo no GitHub com sucesso! O site atualizará em cerca de 30 segundos.");
  } catch (erro) {
    if (erro.message.includes("401")) {
      localStorage.removeItem("github_token");
    }
    alert("Falha: " + erro.message);
  } finally {
    btn.disabled = false;
    btn.innerText = "☁️ Salvar no GitHub";
  }
});

function analisarOrcamentoBase() {
  const mesesUnicos = new Set(lancamentos.map(l => l.data.substring(0, 7)));
  const qtdMeses = mesesUnicos.size || 1;

  const totalGasto = lancamentos.reduce((s, l) => s + l.valor, 0);
  const mediaGastoMensal = totalGasto / qtdMeses;
  const sobraMediaReal = CONFIG.rendaMensal - mediaGastoMensal;

  const porCategoria = {};
  lancamentos.forEach(l => {
    porCategoria[l.categoria] = (porCategoria[l.categoria] || 0) + l.valor;
  });

  const rankingCategorias = Object.entries(porCategoria)
    .map(par => ({ categoria: par.at(0), mediaMensal: par.at(1) / qtdMeses }))
    .sort((a, b) => b.mediaMensal - a.mediaMensal);

  return {
    qtdMeses,
    mediaGastoMensal,
    sobraMediaReal,
    rankingCategorias
  };
}

function calcularAporteNecessario(valorAlvo, valorAtual, meses, taxaPerc) {
  const i = taxaPerc / 100;
  const futuroDoAtual = valorAtual * Math.pow(1 + i, meses);
  const saldoFaltante = Math.max(0, valorAlvo - futuroDoAtual);

  if (saldoFaltante === 0) return 0;
  if (i <= 0) return saldoFaltante / meses;

  return (saldoFaltante * i) / (Math.pow(1 + i, meses) - 1);
}

function estimarCustoPosCompra(tipo, valorBem) {
  if (tipo === "Veiculo") {
    return (valorBem * 0.075) / 12;
  }
  if (tipo === "Imovel") {
    return valorBem * 0.006;
  }
  if (tipo === "Terreno") {
    return (valorBem * 0.015) / 12;
  }
  return 0;
}
