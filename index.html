<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle de Gastos</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

  <!-- CSS do DataTables -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

<!-- jQuery + JS do DataTables -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>


  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    h1 { text-align: center; }
    .resumo { display:flex; gap:20px; justify-content:center; margin:20px 0; }
    .caixa { flex:1; padding:20px; border-radius:8px; color:#fff; text-align:center; font-weight:bold; }
    .renda { background:#4caf50; }
    .despesas { background:#f44336; }
    .saldo { background:#2196f3; }
    canvas { margin:20px auto; display:block; }
    .consulta, .upload { margin:30px auto; width:80%; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { border:1px solid #ccc; padding:8px; text-align:center; }
    th { background:#eee; }
  </style>
</head>
<body>
  <h1>Meu Orçamento Pessoal</h1>

  <div class="resumo">
  <div class="caixa renda" id="caixaRenda"></div>
  <div class="caixa despesas" id="caixaDespesas"></div>
  <div class="caixa saldo" id="caixaSaldo"></div>
  <div class="caixa" id="caixaComprometimento" style="background:#ff9800"></div>
  <div class="caixa" id="caixaSaude" style="background:#607d8b"></div>
</div>

  <div id="filtros" style="margin-bottom:15px; text-align:center;">
  <label for="dataInicio">De:</label>
  <input type="month" id="dataInicio">
  <label for="dataFim">Até:</label>
  <input type="month" id="dataFim">

  <button id="aplicarFiltro">Aplicar Filtro</button>
</div>


 <div id="alertas"
     style="margin:20px;padding:15px;border-radius:8px;background:#fff3cd">
</div> 


  <canvas id="graficoMensal" width="600" height="300"></canvas>
  <canvas id="graficoCategorias" width="600" height="300"></canvas>

<h2>Resumo por Categoria</h2>

<table id="tabelaCategorias">
  <thead>
    <tr>
      <th>Categoria</th>
      <th>Total</th>
      <th>%</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>


  <!-- Container da tabela de lançamentos -->
<div style="margin:10px; text-align:right;">
  <label><input type="checkbox" id="modoConsolidado"> Consolidar lançamentos iguais</label>
</div>

<div id="containerTabelaLancamentos" style="margin-top:20px;">
  <table id="tabelaLancamentos" border="1" style="width:100%;">
    <thead>
      <tr>
        <th>Data</th>
        <th>Categoria</th>
        <th>Descrição</th>
        <th>Valor</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <!-- Linhas preenchidas via JavaScript -->
    </tbody>
  </table>
</div>


<script src="dados.js"></script>
app.jsscript>


<script>

let chartMensal = null;
let chartCategorias = null;
let dadosAtualDashboard = [];
lancamentos.forEach((item,index)=>{
   item.id = index + 1;
});



const CONFIG = {
  rendaMensal: 19000
};

// ----------------------
// Funções principais
// ----------------------

function inicializarCache() {
  localStorage.setItem(
    "lancamentos",
    JSON.stringify(lancamentos)
  );
}

function salvarDados() {
  localStorage.setItem("lancamentos", JSON.stringify(lancamentos));
}

function calcularResumo() {
  const rendaMensal = 19000; // orçamento mensal
  const hoje = new Date();
  const mesAtual = hoje.getMonth();

  const despesas = lancamentos
    .filter(l => new Date(l.data).getMonth() === mesAtual)
    .reduce((s,v)=>s+v.valor,0);

  const saldo = rendaMensal - despesas;

  document.getElementById("caixaRenda").innerText = "Renda: " + rendaMensal.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  document.getElementById("caixaDespesas").innerText = "Despesas: " + despesas.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  document.getElementById("caixaSaldo").innerText = "Saldo: " + saldo.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

}

function graficoMensal(lancamentosFiltrados){

  if(chartMensal){
    chartMensal.destroy ();}
  const mesesNomes = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const porMes = {};

  lancamentosFiltrados.forEach(l=>{
    const d = new Date(l.data);
    const mesIndex = d.getMonth();
    porMes[mesIndex] = (porMes[mesIndex]||0)+l.valor;
  });

  const labels = Object.keys(porMes).map(i => mesesNomes[i]);
  const valores = Object.values(porMes);

  const limite = 19000;
  const cores = valores.map(v=>{
    const perc = (v/limite)*100;
    if(perc <= 90) return "#4caf50";
    if(perc <= 100) return "#ffeb3b";
    return "#f44336";
  });

 chartMensal = new Chart(document.getElementById("graficoMensal"),{
    type: "bar",
    data: {
      labels: labels,
      datasets: [
        { label: "Despesas Mensais", data: valores, backgroundColor: cores },
        { label: "Limite Orçamento", data: Array(valores.length).fill(limite), type: "line", borderColor: "#000", borderWidth: 2, pointRadius: 0 }
      ]
    },
    options: { plugins: { title: { display: true, text: "Acompanhamento Mensal com Limite" } } }
  });
}



function atualizarBoxes(dados){

  const despesas =
    dados.reduce(
      (s,v)=>s+v.valor,
      0
    );

  const saldo =
    CONFIG.rendaMensal - despesas;

  const comprometimento =
    (despesas / CONFIG.rendaMensal) * 100;

  document.getElementById("caixaRenda")
    .innerHTML =
    `<b>Renda</b><br>
     ${CONFIG.rendaMensal.toLocaleString(
       "pt-BR",
       {style:"currency",currency:"BRL"}
     )}`;

  document.getElementById("caixaDespesas")
    .innerHTML =
    `<b>Despesas</b><br>
     ${despesas.toLocaleString(
       "pt-BR",
       {style:"currency",currency:"BRL"}
     )}`;

  document.getElementById("caixaSaldo")
    .innerHTML =
    `<b>Saldo</b><br>
     ${saldo.toLocaleString(
       "pt-BR",
       {style:"currency",currency:"BRL"}
     )}`;

  document.getElementById("caixaComprometimento")
    .innerHTML =
    `<b>Comprometimento</b><br>
     ${comprometimento.toFixed(1)}%`;

  let status="🟢 Saudável";

  if(comprometimento>80)
    status="🟡 Atenção";

  if(comprometimento>95)
    status="🔴 Crítico";

  document.getElementById("caixaSaude")
    .innerHTML =
    `<b>Saúde Financeira</b><br>${status}`;
}


document.getElementById("aplicarFiltro").addEventListener("click", function(){
  const inicio = document.getElementById("dataInicio").value; // YYYY-MM
  const fim = document.getElementById("dataFim").value;

  let lancamentosFiltrados = lancamentos.filter(l=>{
    const anoMes = l.data.substring(0,7);
    return (!inicio || anoMes >= inicio) && (!fim || anoMes <= fim);
  });

  // Atualiza tabela, boxes e gráfico
  dadosAtualDashboard =[...lancamentosFiltrados];
  atualizarTabela(dadosAtualDashboard);
  atualizarBoxes(dadosAtualDashboard);
  graficoMensal(dadosAtualDashboard);
  graficoCategorias(dadosAtualDashboard);
  gerarAlertas(dadosAtualDashboard);
  resumoCategorias(dadosAtualDashboard);
  calcularProjecao(dadosAtualDashboard);
  console.log("Filtro início:", inicio);
  console.log("Filtro fim:", fim);
  console.log("Qtd registros:", lancamentosFiltrados.length);
  console.log(lancamentosFiltrados);
  atualizarTabela(lancamentosFiltrados);
  graficocategorias(lancamentosFiltrados);


});

function gerarAlertas(dados){

  let html="";

  Object.keys(limites)
  .forEach(cat=>{

    const gasto =
      dados
      .filter(
        l=>l.categoria===cat
      )
      .reduce(
        (s,v)=>s+v.valor,
        0
      );

    if(gasto > limites[cat]){

      html += `
      <p>
        ⚠ ${cat}
        ultrapassou limite
        (${gasto.toLocaleString(
          "pt-BR",
          {
            style:"currency",
            currency:"BRL"
          }
        )})
      </p>`;
    }
  });

  document.getElementById(
    "alertas"
  ).innerHTML = html;
}



const limites = {
  "Educação": 2000,
  "Cartões": 5000,
  "Casa/Transporte": 6000
};



$(document).ready(function(){
  $('#tabelaLancamentos').DataTable({
    paging: true,        // paginação
    searching: true,     // caixa de busca
    ordering: true,      // ordenação por coluna
    info: true,          // mostra info "exibindo X de Y"
    language: {
      url: "https://cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json"
    }
  });
});


function graficoCategorias(dados) {

  if(chartCategorias){
  chartCategorias.destroy();
}
  const porCategoria = {};
  dados.forEach(l=>{
    porCategoria[l.categoria] = (porCategoria[l.categoria]||0)+l.valor;
  });

  const total = Object.values(porCategoria).reduce((a,b)=>a+b,0);

  chartCategorias = new Chart(document.getElementById("graficoCategorias"), {
    type:"pie",
    data:{
      labels:Object.keys(porCategoria),
      datasets:[{
        data:Object.values(porCategoria),
        backgroundColor:["#4caf50","#ff9800","#2196f3","#9c27b0","#f44336","#795548","#00bcd4"]
      }]
    },
    options:{
      plugins:{
        title:{display:true,text:"Despesas por Categoria"},
        datalabels:{
          color:"#fff",
          font:{weight:"bold"},
          formatter:(value,ctx)=>{
            let perc = (value/total*100).toFixed(1)+"%";
            return perc; // apenas percentual
          }
        }
      }
    },
    plugins:[ChartDataLabels]
  });
}



function atualizarTabela(lancamentosFiltrados){
  const tbody = document.querySelector("#tabelaLancamentos tbody");
  tbody.innerHTML = ""; // limpa tabela

  lancamentosFiltrados.forEach(l=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
     <td>${l.data}</td>
     <td>${l.categoria}</td>
     <td>${l.descricao}</td>
     <td>${l.valor.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
     <td>
     <button onclick="editarLancamento(${l.id})">

      ✏️
     </button>
     </td>

     `;
    tbody.appendChild(tr); 
  });
}

function editarLancamento(id){

  const item = lancamentos.find(l =>
    l.id === id
);


  if(!item) return;

  const novaDescricao =
    prompt("Descrição", item.descricao);

  if(novaDescricao === null) return;

  const novoValor =
    prompt("Valor", item.valor);

  if(novoValor === null) return;

  item.descricao = novaDescricao;
  item.valor = Number(novoValor);

  salvarDados();

  atualizarTabela(dadosAtualDashboard);
  atualizarBoxes(dadosAtualDashboard);
  graficoMensal(dadosAtualDashboard);
  resumoCategorias(dadosAtualDashboard);
  gerarRanking(dadosAtualDashboard);
}



function consultarPorData() {
  const dataSelecionada = document.getElementById("dataConsulta").value;
  const resultados = lancamentos.filter(l => l.data === dataSelecionada);
  preencherTabela(resultados);
}

function consultarPorDescricao() {
  const filtro = document.getElementById("filtroDescricao").value.toLowerCase();
  const resultados = lancamentos.filter(l => l.descricao.toLowerCase().includes(filtro));
  preencherTabela(resultados);
}

function preencherTabela(resultados) {
  const tbody = document.querySelector("#tabelaResultados tbody");
  tbody.innerHTML = "";
  resultados.forEach(l=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${l.data}</td><td>${l.descricao}</td><td>${l.categoria}</td><td>R$ ${l.valor.toFixed(2)}</td>`;
    tbody.appendChild(tr);
  });
}

function carregarFatura() {
  const arquivo = document.getElementById("arquivoFatura").files[0];
  if (!arquivo) { alert("Selecione um arquivo."); return; }
  alert("Fatura carregada: " + arquivo.name + " (integração futura)");
}

function limparBanco() {
  localStorage.removeItem("lancamentos");
  localStorage.setItem("lancamentos", JSON.stringify(lancamentos));
  atualizarTabela(lancamentos);
  atualizarBoxes(lancamentos);
  graficoMensal(lancamentos);
  graficoCategorias(lancamentos);
  gerarAlertas(lancamentos);
  resumoCategorias(lancamentos);
  alert("Banco limpo e recarregado com os lançamentos atuais!");
}

function resumoCategorias(dados){

  const mapa = {};

  dados.forEach(l => {

    mapa[l.categoria] =
      (mapa[l.categoria] || 0)
      + l.valor;

  });

  const total =
    Object.values(mapa)
      .reduce((a,b)=>a+b,0);

  const tbody =
    document.querySelector(
      "#tabelaCategorias tbody"
    );

  tbody.innerHTML = "";

  Object.entries(mapa)
    .forEach(([categoria,valor])=>{

      tbody.innerHTML += `
        <tr>
          <td>${categoria}</td>

          <td>
            ${valor.toLocaleString(
              "pt-BR",
              {
                style:"currency",
                currency:"BRL"
              }
            )}
          </td>

          <td>
            ${(valor/total*100).toFixed(1)}%
          </td>
        </tr>
      `;
    });
}

console.log("Total de lançamentos:",lancamentos.length);


// ----------------------
// Inicialização
// ----------------------

dadosAtualDashboard = [...lancamentos];
atualizarTabela(lancamentos);
atualizarBoxes(lancamentos);
graficoMensal(lancamentos);
graficoCategorias(lancamentos);
gerarAlertas(lancamentos);
resumoCategorias(lancamentos);
gerarRanking(lancamentos);
calcularProjecao(lancamentos);


</script>
</body>
</html>
