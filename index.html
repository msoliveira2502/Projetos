<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle de Gastos</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    h1 { text-align: center; }
    .resumo { display:flex; gap:20px; justify-content:center; margin:20px 0; }
    .caixa { flex:1; padding:20px; border-radius:8px; color:#fff; text-align:center; font-weight:bold; }
    .renda { background:#4caf50; }
    .despesas { background:#f44336; }
    .saldo { background:#2196f3; }
    canvas { margin:20px auto; display:block; }
    .consulta, .upload { margin:30px auto; width:80%; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { border:1px solid #ccc; padding:8px; text-align:center; }
    th { background:#eee; }
  </style>
</head>
<body>
  <h1>Meu Orçamento Pessoal</h1>

  <div class="resumo">
    <div class="caixa renda" id="caixaRenda">Renda: R$ 0</div>
    <div class="caixa despesas" id="caixaDespesas">Despesas: R$ 0</div>
    <div class="caixa saldo" id="caixaSaldo">Saldo: R$ 0</div>
  </div>

  <canvas id="graficoMensal" width="600" height="300"></canvas>
  <canvas id="graficoSemanal" width="600" height="300"></canvas>
  <canvas id="graficoCategorias" width="600" height="300"></canvas>

  <!-- Área de consultas -->
  <div class="consulta">
    <h2>Consultar Lançamentos</h2>
    <label for="dataConsulta">Selecione a data:</label>
    <input type="date" id="dataConsulta">
    <button onclick="consultarPorData()">Pesquisar</button>

    <input type="text" id="filtroDescricao" placeholder="Descrição (ex: Cartão Nu)">
    <button onclick="consultarPorDescricao()">Pesquisar</button>

    <table id="tabelaResultados">
      <thead>
        <tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Área de upload de faturas -->
  <div class="upload">
    <h2>Carregar Fatura Mensal</h2>
    <input type="file" id="arquivoFatura" accept=".csv,.pdf">
    <button onclick="carregarFatura()">Adicionar ao Banco</button>
    <button onclick="limparBanco()">Limpar Banco e Recarregar</button>
  </div>

<script>
// ----------------------
// Lançamentos corretos (jan–dez/2026)
// ----------------------
let lancamentos = [
  // Janeiro a Dezembro (lista completa conforme planilha)
  // ... [Aqui entram todos os lançamentos que já montamos mês a mês]
];

// ----------------------
// Funções principais
// ----------------------
function carregarDados() {
  localStorage.setItem("lancamentos", JSON.stringify(lancamentos));
}

function salvarDados() {
  localStorage.setItem("lancamentos", JSON.stringify(lancamentos));
}

function calcularResumo() {
  const renda = 19000; // saldo inicial
  const despesas = lancamentos.reduce((s,v)=>s+v.valor,0);
  const saldo = renda - despesas;
  document.getElementById("caixaRenda").innerText = "Renda: R$ " + renda.toFixed(2);
  document.getElementById("caixaDespesas").innerText = "Despesas: R$ " + despesas.toFixed(2);
  document.getElementById("caixaSaldo").innerText = "Saldo: R$ " + saldo.toFixed(2);
}

function graficoMensal() {
  const mesesNomes = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const porMes = {};
  lancamentos.forEach(l=>{
    const d = new Date(l.data);
    const mesIndex = d.getMonth();
    porMes[mesIndex] = (porMes[mesIndex]||0)+l.valor;
  });
  new Chart(document.getElementById("graficoMensal"), {
    type:"bar",
    data:{labels:Object.keys(porMes).map(i=>mesesNomes[i]), datasets:[{label:"Despesas Mensais", data:Object.values(porMes), backgroundColor:"#f44336"}]},
    options:{plugins:{title:{display:true,text:"Acompanhamento Mensal"}}}
  });
}

function graficoSemanal() {
  const ultimoMes = Math.max(...lancamentos.map(l=>new Date(l.data).getMonth()));
  const porSemana = {};
  lancamentos.forEach(l=>{
    const d = new Date(l.data);
    if (d.getMonth() === ultimoMes) {
      const semana = Math.ceil(d.getDate()/7);
      const chave = "Semana "+semana;
      porSemana[chave] = (porSemana[chave]||0)+l.valor;
    }
  });
  new Chart(document.getElementById("graficoSemanal"), {
    type:"line",
    data:{labels:Object.keys(porSemana), datasets:[{label:"Despesas Semanais", data:Object.values(porSemana), borderColor:"#2196f3"}]},
    options:{plugins:{title:{display:true,text:"Semanas do último mês"}}}
  });
}

function graficoCategorias() {
  const porCategoria = {};
  lancamentos.forEach(l=>{
    porCategoria[l.categoria] = (porCategoria[l.categoria]||0)+l.valor;
  });
  new Chart(document.getElementById("graficoCategorias"), {
    type:"pie",
    data:{labels:Object.keys(porCategoria), datasets:[{data:Object.values(porCategoria), backgroundColor:["#4caf50","#ff9800","#2196f3","#9c27b0","#f44336"]}]},
    options:{plugins:{title:{display:true,text:"Despesas por Categoria"}}}
  });
}

function consultarPorData() {
  const dataSelecionada = document.getElementById("dataConsulta").value;
  const resultados = lancamentos.filter(l => l.data === dataSelecionada);
  preencherTabela(resultados);
}

function consultarPorDescricao() {
  const filtro = document.getElementById("filtroDescricao").value.toLowerCase();
  const resultados = lancamentos.filter(l => l.descricao.toLowerCase().includes(filtro));
  preencherTabela(resultados);
}

function preencherTabela(resultados) {
  const tbody = document.querySelector("#tabelaResultados tbody");
  tbody.innerHTML = "";
  resultados.forEach(l=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${l.data}</td><td>${l.descricao}</td><td>${l.categoria}</td><td>R$ ${l.valor.toFixed(2)}</td>`;
    tbody.appendChild(tr);
  });
}

function carregarFatura() {
  const arquivo = document.getElementById("arquivoFatura").files[0];
  if (!arquivo) { alert("Selecione um arquivo."); return; }
  alert("Fatura carregada: " + arquivo.name + " (integração futura)");
}

function limparBanco() {
  localStorage.removeItem("lancamentos");
  localStorage.setItem("lancamentos", JSON.stringify(lancamentos));
  calcularResumo();
  graficoMensal();
  graficoSemanal();
  graficoCategorias();
  alert("Banco limpo e recarregado com os lançamentos atuais!");
}

// ----------------------
// Inicialização
// ----------------------
carregarDados();
calcularResumo();
graficoMensal();
graficoSemanal();
graficoCategorias();
</script>
</body>
</html>
